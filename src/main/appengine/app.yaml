runtime: java17
env: standard

instance_class: F2  # Chọn instance class thích hợp (F2 cho ứng dụng nhỏ)
automatic_scaling:
  min_idle_instances: 1  # Số phiên bản tối thiểu
  max_idle_instances: 3  # Số phiên bản tối đa
  min_pending_latency: 30ms  # Độ trễ tối thiểu cho yêu cầu chờ
  max_pending_latency: 60ms  # Độ trễ tối đa cho yêu cầu chờ

env_variables:
  SPRING_PROFILES_ACTIVE: prod  # Cấu hình cho môi trường sản phẩm (nếu cần)
